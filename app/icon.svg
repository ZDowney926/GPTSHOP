      fill-rule="evenodd"
      mask="url(#g-cut)"
      d="M256 96a160 160 0 1 1 0 320a160 160 0 1 1 0-320ZM256 170a86 86 0 1 0 0 172a86 86 0 1 0 0-172Z"
    />
    <rect x="252" y="228" width="142" height="58" rx="29" fill="#ffffff"/>
    <rect x="336" y="228" width="58" height="116" rx="29" fill="#ffffff"/>
