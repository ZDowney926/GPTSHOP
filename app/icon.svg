      <rect x="302" y="92" width="150" height="136" rx="40" fill="#000000"/>
    </mask>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#glow)"/>
  <rect x="40" y="40" width="432" height="432" rx="112" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g filter="url(#shadow)">
